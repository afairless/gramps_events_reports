[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The one shipped artifact is the `gramps-events` binary (plan §4/§6.5 —
# CLI and web UI live in the same binary); the library crate keeps the
# package name `cli` so `use cli::…` tests stay stable.
[[bin]]
name = "gramps-events"
path = "src/main.rs"

[dependencies]
# The command-line surface (plan §6.5): derive macro for subcommands and
# argument parsing.
clap = { version = "4", features = ["derive"] }
# The CLI is the facade over the layered crates, so the best-effort error
# type (anyhow) is the right choice here — parse and I/O failures read as
# plain messages (plan §6.5).
anyhow = "1"

# The layered crates this binary drives: parse → core → writers → web.
gramps-xml = { path = "../gramps-xml" }
event-core = { path = "../event-core" }
writers = { path = "../writers" }
# The local web UI (milestone 13): `serve` starts the axum server via the
# web crate; tokio's multi-thread runtime is what its `serve` entry point
# blocks on.
web = { path = "../web" }
tokio = { workspace = true }
# Civil-date parsing for `--date-range START..END` (jiff::civil::Date).
jiff = { workspace = true }

[dev-dependencies]
# Isolated directories for `report` output in unit/snapshot tests.
tempfile = "3"
# The large-file benchmark (step 14) generates its ~100k-event fixture
# on demand via the benchgen crate instead of committing multi-MB XML.
benchgen = { path = "../benchgen" }
