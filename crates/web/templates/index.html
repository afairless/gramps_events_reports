<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>gramps-events</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <script src="/static/htmx.min.js"></script>
  <script>
    // The active view tab. Kept in the options form's hidden `view` field
    // so the next options change re-renders the *same* tab (plan §9:
    // the PUT route answers with the current view's fragment).
    function setView(view) {
      const field = document.getElementById('view');
      if (field) { field.value = view; }
      for (const tab of document.querySelectorAll('#tabs .tab')) {
        tab.classList.toggle('active', tab.dataset.view === view);
      }
    }
  </script>
</head>
<body>
  <h1>gramps-events</h1>
  <p class="tagline">Local viewer for the events of a Gramps database — the data never leaves this machine.</p>
  <main id="main">
    {% include "main.html" %}
  </main>
</body>
</html>
