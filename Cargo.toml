# Gramps Events Report — Cargo workspace.
#
# One binary ships the CLI and the `serve` subcommand (the `web` UI);
# the crates are strictly layered as ingestion → transformation → output:
#
#   gramps-dates ──▶ gramps-xml ──▶ event-core ──▶ writers / web / cli
#
# Shared dependency versions are pinned here in [workspace.dependencies]
# as milestones introduce them.

[workspace]
members = [
    "crates/gramps-xml",
    "crates/gramps-dates",
    "crates/event-core",
    "crates/writers",
    "crates/cli",
    "crates/web",
]
resolver = "3"

# Shared dependency versions are pinned here in [workspace.dependencies]
# as milestones introduce them.
[workspace.dependencies]
thiserror = "2"
# Civil-date math: pinned at milestone 4 (gramps-dates).
jiff = "0.2"
# Flat output contract: pinned at milestone 8 when EventRow gains its serde
# shape (CSV/JSON/Parquet writers consume it from milestone 9/10 on).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# .gramps containers + XML parsing: pinned at milestone 1/4 (gramps-xml).
flate2 = "1.1"
roxmltree = "0.21"
# Only deflate decompression is needed to read Gramps "saved tree" zips;
# the default feature set pulls in bzip2/lzma/zstd backends we never use.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Row writers (milestone 10): csv / json / parquet backends (plan §6.3).
csv = "1.4"
# arrow-rs pinned at 60.x per plan §6.3 — StructArray → RecordBatch →
# ArrowWriter, plus ParquetRecordBatchReaderBuilder in the round-trip tests.
arrow = "60"
parquet = "60"
# PDF writer (milestone 11): the Typst renderer behind the `PdfBackend`
# trait (plan §6.3, decision D2). The plan calls for typst 0.15; the
# installed toolchain is rustc 1.91 while typst ≥ 0.15 requires 1.92, so
# the exact verified patch — 0.14.2, rust 1.89 — is pinned here (their
# APIs churn between minor releases, per plan §6.3).
typst = "=0.14.2"
typst-pdf = "=0.14.2"
# The PdfWorld font book is fed by typst's bundled fonts (Libertinus
# Serif + friends) so `TypstPdf` needs no system font lookup and stays
# deterministic across machines.
typst-assets = "=0.14.2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"