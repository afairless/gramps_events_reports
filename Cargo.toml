# Gramps Events Report — Cargo workspace.
#
# One binary ships the CLI and the `serve` subcommand (the `web` UI);
# the crates are strictly layered as ingestion → transformation → output:
#
#   gramps-dates ──▶ gramps-xml ──▶ event-core ──▶ writers / web / cli
#
# Shared dependency versions are pinned here in [workspace.dependencies]
# as milestones introduce them.

[workspace]
members = [
    "crates/gramps-xml",
    "crates/gramps-dates",
    "crates/event-core",
    "crates/writers",
    "crates/cli",
    "crates/web",
]
resolver = "3"

# Shared dependency versions are pinned here in [workspace.dependencies]
# as milestones introduce them.
[workspace.dependencies]
thiserror = "2"
# Civil-date math: pinned at milestone 4 (gramps-dates).
jiff = "0.2"
# .gramps containers + XML parsing: pinned at milestone 1/4 (gramps-xml).
flate2 = "1.1"
roxmltree = "0.21"
# Only deflate decompression is needed to read Gramps "saved tree" zips;
# the default feature set pulls in bzip2/lzma/zstd backends we never use.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"